# XcodeGen spec for the throwaway Live Activity spike.
# CI runs `xcodegen generate` in this folder; the .xcodeproj is never committed.
name: TimeSpike

options:
  bundleIdPrefix: com.isin
  developmentLanguage: en
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "26.0"

settings:
  base:
    DEVELOPMENT_TEAM: RNN5SP32QS
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    # Overridden on the xcodebuild command line with the GitHub run number.
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1"
    # Swift 5 language mode: avoids Swift 6 strict-concurrency errors we cannot iterate on without a Mac.
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  TimeSpike:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
      - path: Resources/Fonts
        buildPhase: resources
      - path: Resources/Sounds
        buildPhase: resources
      - path: Resources/Privacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: TimeSpike
        PRODUCT_BUNDLE_IDENTIFIER: com.isin.time
        INFOPLIST_FILE: Config/App-Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
    dependencies:
      - target: TimeSpikeWidgets
        embed: true
      - sdk: AppIntents.framework

  TimeSpikeWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
      - path: Resources/Fonts
        buildPhase: resources
      - path: Resources/Privacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: TimeSpikeWidgets
        PRODUCT_BUNDLE_IDENTIFIER: com.isin.time.widgets
        INFOPLIST_FILE: Config/Widgets-Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
      configs:
        # WIDGET_EXTENSION turns the shared LiveActivityIntents into stubs inside the extension
        # (the system runs LiveActivityIntent.perform() in the app process).
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG WIDGET_EXTENSION"
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "WIDGET_EXTENSION"
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: AppIntents.framework

schemes:
  TimeSpike:
    build:
      targets:
        TimeSpike: all
    run:
      config: Debug
    archive:
      config: Release
