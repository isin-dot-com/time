<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>До отбоя: макеты экранов</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Martian+Mono:wght@400;500&family=Onest:wght@400;500;600;800&family=Unbounded:wght@300;500;800&display=swap" rel="stylesheet">
<style>
:root{
  --page:#dfe2e8; --page-ink:#171b27; --page-dim:#5a6172; --page-line:#c3c8d2; --page-panel:#eef0f4; --page-acc:#3b2f6b;
  --z:1;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--page);color:var(--page-ink);font-family:Onest,system-ui,sans-serif;font-size:16px;line-height:1.45;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--page-acc);outline-offset:2px}

/* ---------- page ---------- */
.top{padding:40px 24px 8px;max-width:1760px;margin:0 auto}
.top h1{font-family:Unbounded,sans-serif;font-weight:500;font-size:clamp(34px,6vw,72px);line-height:1;letter-spacing:-.03em}
.top p{max-width:62ch;margin-top:14px;color:var(--page-dim)}
.bar{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--page) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--page-line)}
.bar-in{max-width:1760px;margin:0 auto;padding:10px 24px;display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center}
.grp{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.grp>span{font-size:13px;color:var(--page-dim);margin-right:4px}
.grp button{font-size:13px;padding:6px 11px;border-radius:999px;border:1px solid var(--page-line);background:var(--page-panel)}
.grp button[aria-pressed=true]{background:var(--page-ink);color:var(--page);border-color:var(--page-ink)}
section{max-width:1760px;margin:0 auto;padding:44px 24px 8px}
section h2{font-family:Unbounded,sans-serif;font-weight:500;font-size:22px;letter-spacing:-.01em}
section>p{color:var(--page-dim);max-width:72ch;margin-top:6px;font-size:15px}
.row{display:flex;flex-wrap:wrap;gap:36px 32px;margin-top:24px;align-items:flex-start}
figure{width:calc(413px*var(--z))}
figcaption{font-size:13px;color:var(--page-dim);margin-top:10px;max-width:calc(413px*var(--z))}
figcaption b{color:var(--page-ink);font-weight:600}
footer{max-width:1760px;margin:0 auto;padding:48px 24px 64px;color:var(--page-dim);font-size:13px}

/* ---------- phone ---------- */
.phone{zoom:var(--z);width:413px;border:10px solid #0b0c10;border-radius:58px;background:#0b0c10;overflow:hidden}
.phone.crop{border-bottom:0;border-radius:58px 58px 0 0}
.scr{position:relative;width:393px;height:852px;border-radius:48px;overflow:hidden;font-family:Onest,system-ui,sans-serif;font-size:15px;line-height:1.3;color:#fff}
.crop .scr{border-radius:48px 48px 0 0}
.status{position:absolute;top:0;left:0;right:0;height:54px;display:flex;justify-content:space-between;align-items:center;padding:6px 34px 0;font-weight:600;font-size:15px;z-index:5}
.status .sig{display:flex;gap:6px;align-items:center;font-size:13px}
.batt{width:25px;height:12px;border-radius:4px;background:currentColor;opacity:.9}
.pill{position:absolute;top:11px;left:50%;transform:translateX(-50%);height:37px;width:126px;border-radius:20px;background:#000;z-index:6;display:flex;align-items:center;justify-content:space-between;padding:0 10px;color:#fff}
.homebar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:140px;height:5px;border-radius:3px;background:currentColor;opacity:.85;z-index:5}

/* themes: affect card, island accent, home widgets, app */
body[data-theme=coal]{--c-bg:#1d1c1a;--c-ink:#f3ead9;--c-dim:#a59c8c;--c-acc:#d8c6a4;--c-on:#1d1c1a;--c-track:#3a3733;--c-row:#282623;--c-di:#d8c6a4;--f-num:Unbounded;--w-num:500;--dw:.8em}
body[data-theme=paper]{--c-bg:#f1eee6;--c-ink:#1b2742;--c-dim:#6c7385;--c-acc:#1b2742;--c-on:#f1eee6;--c-track:#d6d1c4;--c-row:#e6e2d7;--c-di:#ece6d6;--f-num:Fraunces;--w-num:600;--dw:.6em}
body[data-theme=signal]{--c-bg:#16171b;--c-ink:#ffffff;--c-dim:#9498a3;--c-acc:#ff3b30;--c-on:#fff;--c-track:#32343b;--c-row:#22242a;--c-di:#ff3b30;--f-num:Onest;--w-num:800;--dw:.62em}
body[data-theme=sunset]{--c-bg:linear-gradient(150deg,#f0a23b 0%,#c9554f 52%,#5b2a5e 100%);--c-ink:#fff7ea;--c-dim:#ffe0c4;--c-acc:#fff7ea;--c-on:#7a2f4e;--c-track:rgba(255,255,255,.28);--c-row:rgba(255,255,255,.16);--c-di:#f0a23b;--f-num:Unbounded;--w-num:300;--dw:.78em}
body[data-theme=terminal]{--c-bg:#030b05;--c-ink:#3dff7c;--c-dim:#1f9a49;--c-acc:#3dff7c;--c-on:#030b05;--c-track:#0e3a1c;--c-row:#07190c;--c-di:#3dff7c;--f-num:"Martian Mono";--w-num:500;--dw:.66em}
body[data-theme=neon]{--c-bg:#000;--c-ink:#fff;--c-dim:#8b8f98;--c-acc:#3dffd0;--c-on:#000;--c-track:#23262b;--c-row:#111316;--c-di:#3dffd0;--f-num:Unbounded;--w-num:800;--dw:.82em}
body[data-theme=terminal] .themed{font-family:"Martian Mono",monospace;letter-spacing:-.04em}
body[data-theme=terminal] .num{letter-spacing:-.03em}
body[data-theme=terminal] .num i,body[data-theme=terminal] .num i.c{width:auto}

.num{font-family:var(--f-num),Onest,sans-serif;font-weight:var(--w-num);white-space:nowrap;letter-spacing:0}
.num i{display:inline-block;width:var(--dw);text-align:center;font-style:normal}
.num i.c{width:.38em}
.sysnum i{display:inline-block;width:.6em;text-align:center;font-style:normal}
.sysnum i.c{width:.3em}

/* ---------- lock screen ---------- */
.lock{background:
  radial-gradient(120% 40% at 30% 66%,#2a2331 0 60%,transparent 61%),
  radial-gradient(90% 34% at 85% 70%,#1f1a26 0 60%,transparent 61%),
  linear-gradient(180deg,#27365a 0%,#59608a 30%,#b98792 50%,#e7ae84 60%,#3a2c3a 61%,#17141b 100%)}
.lock.night{background:
  radial-gradient(120% 40% at 30% 66%,#0d0e16 0 60%,transparent 61%),
  radial-gradient(90% 34% at 85% 70%,#0a0b12 0 60%,transparent 61%),
  linear-gradient(180deg,#05070f 0%,#101730 45%,#1c2748 60%,#0a0b12 61%,#050508 100%)}
.l-date{position:absolute;top:70px;left:0;right:0;text-align:center;font-size:21px;font-weight:600;opacity:.95}
.l-clock{position:absolute;top:92px;left:0;right:0;text-align:center;font-size:104px;font-weight:600;line-height:1;letter-spacing:-.03em;opacity:.95}
.l-wid{position:absolute;top:208px;left:22px;right:22px;display:flex;gap:12px;align-items:center}
.wr{width:172px;height:76px;padding:8px 10px;border-radius:16px;background:rgba(255,255,255,.14);display:flex;flex-direction:column;justify-content:center;gap:3px;color:#fff}
.wr .a{display:flex;align-items:baseline;gap:6px;font-size:11px;opacity:.85}
.wr .a b{font-size:22px;font-weight:600;opacity:1}
.wr .b{font-size:12px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.wc{width:76px;height:76px;border-radius:50%;background:rgba(255,255,255,.14);position:relative;display:grid;place-items:center;color:#fff;font-weight:600;font-size:15px}
.wc svg{position:absolute;inset:0}
.l-bot{position:absolute;bottom:38px;left:46px;right:46px;display:flex;justify-content:space-between}
.l-bot span{width:50px;height:50px;border-radius:50%;background:rgba(40,40,46,.6);display:grid;place-items:center}
.l-bot span::after{content:"";width:18px;height:18px;border-radius:5px;border:2px solid #fff;opacity:.9}
.l-stack{position:absolute;left:11px;right:11px;bottom:112px;display:flex;flex-direction:column;gap:8px}

/* live activity card: 371 x <=160 */
.la{width:371px;height:156px;max-height:160px;border-radius:26px;padding:14px 16px 14px;background:var(--c-bg);color:var(--c-ink);display:flex;flex-direction:column;overflow:hidden}
.la-h{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--c-dim);height:28px}
.la-h b{color:var(--c-ink);font-weight:600}
.la-more{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--c-dim);display:grid;place-items:center;color:var(--c-ink)}
.la-more svg{width:14px;height:14px}
.la .num{font-size:40px;line-height:46px;margin-left:-2px}
.la-p{font-size:14px;line-height:18px;height:36px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:2px}
.dl{position:relative;height:5px;border-radius:3px;background:var(--c-track);margin-top:auto}
.dl s{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--c-acc)}
.dl u{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--c-bg);opacity:.9}
body[data-theme=sunset] .dl u{background:#a8475a}
body[data-theme=signal] .la.last .num{color:var(--c-acc)}
.la.closed .num{font-size:30px}

/* notification */
.nt{font-family:Onest,system-ui,sans-serif !important;letter-spacing:0 !important;max-width:100%;box-sizing:border-box;width:371px;border-radius:24px;padding:12px 14px;background:rgba(245,245,247,.82);color:#111;display:flex;gap:10px;backdrop-filter:blur(12px)}
.nt .ic,.ic{flex:none;width:38px;height:38px;border-radius:9px;background:#15161b;display:grid;place-items:center}
.nt b{display:block;font-size:15px}
.nt span{font-size:15px;line-height:1.25}
.nt em{margin-left:auto;font-style:normal;font-size:13px;color:#555;flex:none}

/* dynamic island */
.pill.compact{width:236px}
.pill .t{font-size:15px;font-weight:600;color:var(--c-di)}
.dot{position:absolute;top:11px;left:calc(50% + 126px);width:37px;height:37px;border-radius:50%;background:#000;z-index:6;display:grid;place-items:center}
.pill.other{width:170px;transform:translateX(-62%)}
.pill.other::before{content:"";width:18px;height:18px;border-radius:5px;background:#35c759}
.di-x{position:absolute;top:11px;left:11px;width:371px;height:150px;border-radius:44px;background:#000;z-index:7;padding:20px 22px 18px;display:flex;flex-direction:column;color:#fff}
.di-x .h{display:flex;justify-content:space-between;font-size:13px;color:#9a9aa2}
.di-x .num{font-size:34px;line-height:42px;color:#fff}
.di-x .p{font-size:14px;line-height:18px;color:#e6e6ea;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.di-x .dl{background:#2a2a2e}.di-x .dl s{background:var(--c-di)}.di-x .dl u{background:#000}

/* home screen */
.home{background:linear-gradient(160deg,#2c3a63,#7a6c93 55%,#d89c84)}
.h-grid{position:absolute;top:74px;left:14px;right:14px;display:grid;grid-template-columns:repeat(2,1fr);gap:20px 24px}
.hw{border-radius:24px;background:var(--c-bg);color:var(--c-ink);padding:16px;display:flex;flex-direction:column;height:170px;overflow:hidden}
.hw.s{width:170px}.hw.m{grid-column:1/3}
.hw small{font-size:12px;color:var(--c-dim)}
.hw.s .num{font-size:30px;line-height:40px;margin-top:6px}
.hw.m .num{font-size:44px;line-height:52px}
.hw p{font-size:14px;line-height:18px;margin-top:auto;margin-bottom:10px}
.hw.s p{font-size:13px;line-height:16px}
.h-ic{display:grid;grid-template-columns:repeat(2,60px);gap:20px 22px;align-content:start;justify-content:center;padding-top:6px}
.h-ic span{width:60px;height:60px;border-radius:14px;background:rgba(255,255,255,.22)}

/* ---------- app + onboarding (themed) ---------- */
.app{background:var(--c-bg);color:var(--c-ink)}
.app .status,.app .homebar{color:var(--c-ink)}
.a-body{position:absolute;top:60px;left:0;right:0;bottom:92px;padding:6px 22px 0;overflow:hidden;display:flex;flex-direction:column}
.a-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.a-h h3{font-size:30px;font-weight:800;letter-spacing:-.02em}
.gear{width:34px;height:34px;border-radius:50%;background:var(--c-row);display:grid;place-items:center}
.gear::after{content:"";width:14px;height:14px;border-radius:50%;border:3px dotted var(--c-ink)}
.tabs{position:absolute;left:0;right:0;bottom:0;height:86px;padding:10px 12px 0;display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--c-track);font-size:11px;text-align:center;color:var(--c-dim)}
.tabs span::before{content:"";display:block;width:22px;height:22px;margin:0 auto 4px;border-radius:7px;border:2px solid currentColor}
.tabs .on{color:var(--c-ink);font-weight:600}
.tabs .on::before{background:var(--c-acc);border-color:var(--c-acc)}
.big{font-size:54px;line-height:62px;margin:10px 0 0 -3px}
.sub{font-size:13px;color:var(--c-dim)}
.say{font-size:19px;line-height:25px;margin:10px 0 18px;min-height:50px}
.dl.tall{height:10px;border-radius:5px;margin:0 0 6px}
.dl.tall s{border-radius:5px}
.dl i{position:absolute;top:-5px;width:20px;height:20px;margin-left:-10px;border-radius:50%;background:var(--c-ink);border:4px solid var(--c-row)}
.dl-lab{display:flex;font-size:12px;color:var(--c-dim);margin-bottom:16px}
.cta{display:block;width:100%;height:52px;border-radius:16px;background:var(--c-acc);color:var(--c-on);font-weight:600;font-size:17px;text-align:center;line-height:52px}
.cta.ghost{background:none;color:var(--c-ink);border:1.5px solid var(--c-track)}
.list{border-radius:16px;background:var(--c-row);margin-top:14px}
.list>div{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 14px;font-size:15px;border-top:1px solid var(--c-track)}
.list>div:first-child{border-top:0}
.list em{font-style:normal;color:var(--c-dim);font-size:14px;text-align:right;flex:none}
.cap{font-size:13px;color:var(--c-dim);margin:18px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chips span{padding:8px 13px;border-radius:999px;background:var(--c-row);font-size:14px}
.chips .on{background:var(--c-acc);color:var(--c-on);font-weight:600}
.lockd{font-size:11px;padding:2px 7px;border-radius:999px;border:1px solid var(--c-dim);color:var(--c-dim)}
.sw{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px}
.sw div{font-size:12px;text-align:center;color:var(--c-dim)}
.sw div::before{content:"";display:block;height:44px;border-radius:12px;margin-bottom:5px;background:var(--s);border:1.5px solid var(--c-track)}
.sw .on{color:var(--c-ink);font-weight:600}.sw .on::before{outline:2.5px solid var(--c-acc);outline-offset:2px}
.tog{width:46px;height:28px;border-radius:14px;background:var(--c-track);position:relative;flex:none}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--c-ink)}
.mini{zoom:.86;margin:0 -4px 0 -4px}
.mini .la{box-shadow:0 0 0 1px var(--c-track)}

.ob{position:absolute;top:70px;left:0;right:0;bottom:34px;padding:0 26px;display:flex;flex-direction:column}
.steps{display:flex;gap:5px;margin-bottom:26px}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--c-track)}
.steps i.on{background:var(--c-acc)}
.ob h3{font-size:30px;line-height:34px;font-weight:800;letter-spacing:-.02em}
.ob .lead{font-size:16px;line-height:22px;color:var(--c-dim);margin-top:12px}
.opts{margin-top:24px;display:flex;flex-direction:column;gap:10px}
.opts div{padding:15px 16px;border-radius:16px;background:var(--c-row);font-size:17px}
.opts div small{display:block;font-size:13px;color:var(--c-dim);margin-top:3px}
.opts .on{box-shadow:inset 0 0 0 2px var(--c-acc)}
.times{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:24px}
.times div{padding:16px;border-radius:16px;background:var(--c-row)}
.times .num{font-size:30px;display:block;margin-top:4px}
.ob .end{margin-top:auto;display:flex;flex-direction:column;gap:6px}
.skip{text-align:center;font-size:14px;color:var(--c-dim);padding:8px}
.how{margin-top:22px;display:flex;flex-direction:column;gap:14px;font-size:16px}
.how div{display:flex;gap:12px}
.how b{flex:none;width:26px;height:26px;border-radius:50%;background:var(--c-row);display:grid;place-items:center;font-size:13px}
@media (prefers-reduced-motion:no-preference){.grp button{transition:background .15s,color .15s}}
@media (max-width:600px){.bar{position:static}.top{padding:28px 16px 8px}.bar-in,section,footer{padding-left:16px;padding-right:16px}.row{gap:28px}}
</style>
</head>
<body data-theme="coal">
<header class="top">

</header>
<div class="bar"><div class="bar-in" id="bar"></div></div>
<main id="main"></main>
<footer id="foot"></footer>

const segOf=m=>t().seg[m==='x'||m==='e'?'l':m];

const T0=Date.now(), DAY=15*3600, DEMO={live:12*3600+48*60+33,m:14*3600+58*60+7,d:8*3600+26*60+41,l:47*60+12,w:6*3600+42*60+10};
function secs(k){
  const el=Math.floor((Date.now()-T0)/1000);
  if(k==='live'){const n=new Date(),h=n.getHours();
    if(h>=8&&h<23){const b=new Date(n);b.setHours(23,0,0,0);return Math.floor((b-n)/1000)}
    return Math.max(0,DEMO.live-el)}
  return Math.max(0,DEMO[k]-el);
}
const p2=n=>String(n).padStart(2,'0');
function fmt(s,f){const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;
  const str=f==='hm'?h+':'+p2(m):h+':'+p2(m)+':'+p2(x);
  return [...str].map(c=>c===':'?'<i class="c">:</i>':'<i>'+c+'</i>').join('')}
const pct=k=>Math.min(100,Math.max(0,(1-secs(k)/DAY)*100));
function tick(){
  document.querySelectorAll('[data-t]').forEach(e=>{e.innerHTML=fmt(secs(e.dataset.t),e.dataset.f)});
  document.querySelectorAll('[data-p]').forEach(e=>{e.style.width=pct(e.dataset.p)+'%'});
  document.querySelectorAll('[data-ring]').forEach(e=>{e.setAttribute('stroke-dashoffset',(100-(100-pct(e.dataset.ring))).toFixed(1))});
  const n=new Date();document.querySelectorAll('[data-clock]').forEach(e=>{e.textContent=n.getHours()+':'+p2(n.getMinutes())});
}
